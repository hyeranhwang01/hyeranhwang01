@keyframes f{to{opacity:1}}
@keyframes h{0%,100%{transform:scale(1)}20%{transform:scale(1.18)}40%{transform:scale(.97)}}
@media (prefers-reduced-motion:reduce){.c{animation:none;stroke-dashoffset:0}.n{animation:none;opacity:1}.b{animation:none}}
</style>
