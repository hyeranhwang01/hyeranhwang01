<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300">
<style>
.c{stroke-dasharray:420;stroke-dashoffset:420;animation:d 2.2s ease .4s forwards}
.n{opacity:0;animation:f .6s ease 2.2s forwards}
.b{transform-box:fill-box;transform-origin:center;animation:h 1.6s ease-in-out 2.8s 3}
